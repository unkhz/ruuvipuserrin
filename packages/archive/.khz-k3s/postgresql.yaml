---
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: ruuvipuserrin
  namespace: apps
  labels:
    app.kubernetes.io/part-of: ruuvipuserrin
    argocd.argoproj.io/instance: ruuvipuserrin
spec:
  enableLogicalBackup: false
  teamId: acid
  # hcloud-volumes has no CSI snapshot support, so velero backs this
  # volume up via node-agent fs-backup (kopia, crash-consistent) instead
  # of a CSI snapshot. ctrl tasks 006/007.
  podAnnotations:
    backup.velero.io/backup-volumes: pgdata
  volume:
    size: 1Gi
  numberOfInstances: 1
  users:
    archive:
      - nosuperuser
  databases:
    ruuvi_dev: archive
    ruuvi_prod: archive
  postgresql:
    version: '17'
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: '1'
      memory: 1Gi
