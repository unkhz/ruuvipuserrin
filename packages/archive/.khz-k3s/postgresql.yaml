---
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: ruuvipuserrin
  namespace: apps
  labels:
    app.kubernetes.io/part-of: ruuvipuserrin
    argocd.argoproj.io/instance: ruuvipuserrin
spec:
  enableLogicalBackup: false
  teamId: acid
  volume:
    size: 1Gi
  numberOfInstances: 1
  users:
    archive:
      - nosuperuser
    # read-only login for the WAL archiving check (pg_stat_archiver is
    # readable by any role); ctrl task 020
    archivemon: []
  databases:
    ruuvi_dev: archive
    ruuvi_prod: archive
  postgresql:
    version: '17'
  env:
    # Hetzner object storage (Ceph) rejects SSE with a bare 400
    # InvalidArgument. spilo-17 disabled SSE implicitly for custom
    # endpoints; spilo-18 defaults WALG_S3_SSE=AES256, which silently broke
    # all WAL archiving in 2026-07/08 (ctrl task 019).
    - name: WALG_DISABLE_S3_SSE
      value: 'true'
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: '1'
      memory: 1Gi
